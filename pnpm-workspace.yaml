packages:
  - apps/*
  - packages/*
  - e2e

engineStrict: true

# Dependency install scripts are blocked unless listed here (supply-chain hygiene).
allowBuilds:
  '@prisma/engines': true # downloads the schema engine used by prisma migrate
  prisma: true
  cpu-features: false # optional native speedup for ssh2 (via testcontainers), not needed
  ssh2: false
  protobufjs: false

# Security overrides for transitive deps of the Prisma 7 CLI (#13). Remove once Prisma ships them.
overrides:
  mysql2: ^3.24.5 # GHSA-3f6p-5ww8-9rcr; only used by the CLI for MySQL, we use Postgres
  deepmerge-ts: ^8.0.2 # GHSA-ggr8-5vv4-36mx; used by @prisma/config

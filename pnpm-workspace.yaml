packages:
  - apps/*
  - packages/*
  - e2e

engineStrict: true

# Dependency install scripts are blocked unless listed here (supply-chain hygiene).
allowBuilds:
  '@prisma/engines': true # downloads the schema engine used by prisma migrate
  prisma: true
  cpu-features: false # optional native speedup for ssh2 (via testcontainers), not needed
  ssh2: false
  protobufjs: false
  '@scarf/scarf': false # install-time download analytics (via swagger-ui-dist), not needed

# nestjs-zod 5.5 declares Nest ^10 || ^11 (common) and swagger ^7-^11 but works on Nest 12 (ADR 0006). Remove with #89.
peerDependencyRules:
  allowedVersions:
    nestjs-zod>@nestjs/common: '12'
    nestjs-zod>@nestjs/swagger: '12'

# Security overrides for transitive deps of the Prisma 7 CLI (#13). Remove once Prisma ships them.
overrides:
  mysql2: ^3.24.5 # GHSA-3f6p-5ww8-9rcr; only used by the CLI for MySQL, we use Postgres
  deepmerge-ts: ^8.0.2 # GHSA-ggr8-5vv4-36mx; used by @prisma/config
  # Same for @nestjs/platform-express 12, which pins multer and express exactly. Remove once Nest
  # ships them.
  body-parser: ^2.4.0 # GHSA-27r3-jxmh-p828; via express
  multer: ^2.5.0 # GHSA-q7qp-rjg7-q26m

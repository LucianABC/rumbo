version: 2

updates:
  - package-ecosystem: npm # also covers pnpm (reads pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Supply-chain hygiene: don't propose a release until it has been public for a few days.
    cooldown:
      default-days: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
